<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Log Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;

        }

        .log-entry {
            display: grid;
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }

        .card-custom {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }


        .section-title {
            font-weight: 600;
            font-size: 1.25rem;
        }
    </style>
</head>



<body class="bg-secondary bg-opacity-10">


    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 ps-3" href="#">
                <span class="fw-bold fs-5">🔍 AIOPS Log Search</span>
            </a>
        </div>
    </nav>


    <main class="container-fluid  my-1 py-1 ">

        <div class="card card-custom p-2 mb-3 shadow-sm border-0">
            <div class="section-title mb-3 d-flex align-items-center gap-2 text-primary">
                <i class="bi bi-funnel-fill fs-4"></i> Search Logs
            </div>

            <form class="needs-validation" novalidate onsubmit="filterLogs(event)">

                <div class="mb-3">
                    <label for="searchQuery" class="form-label fw-semibold">Search Terms or Regex</label>
                    <textarea id="searchQuery" class="form-control shadow-sm" rows="2"
                        placeholder="e.g. error timeout or ^ERROR if using regex" style="font-family: monospace;"
                        required></textarea>
                    <div class="invalid-feedback">
                        Search query is required (can be plain text or regex).
                    </div>
                </div>


                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="useRegex">
                    <label class="form-check-label fw-medium text-muted" for="useRegex">
                        Use Regular Expression
                    </label>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4 col-12">
                        <label for="server" class="form-label fw-semibold">Server</label>
                        <select class="form-select" id="server" name="server" required>
                            <option value="" disabled selected>Select Probe server</option>

                        </select>
                        <div class="invalid-feedback">Please select a server.</div>
                    </div>

                    <div class="col-md-4 col-12">
                        <label for="service" class="form-label fw-semibold">Service</label>
                        <select class="form-select" id="service" name="service" required>
                            <option value="" disabled selected>Select Service</option>

                        </select>
                        <div class="invalid-feedback">Please select a service.</div>
                    </div>

                    <div class="col-md-4 col-12">
                        <label for="logname" class="form-label fw-semibold">Log Name</label>
                        <select class="form-select" id="logname" name="logname" required>
                            <option value="" disabled selected>Select Log</option>

                        </select>
                        <div class="invalid-feedback">Please select a log name.</div>
                    </div>
                </div>

                <div class="row g-3 align-items-start">
                    <div class="col-md-3">
                        <label for="startTime" class="form-label fw-semibold">Start Time</label>
                        <input type="datetime-local" id="startTime" class="form-control shadow-sm">
                        <small class="text-muted">Defaults to 24 hours ago</small>
                    </div>

                    <div class="col-md-3">
                        <label for="endTime" class="form-label fw-semibold">End Time</label>
                        <input type="datetime-local" id="endTime" class="form-control shadow-sm">
                        <small class="text-muted">Defaults to current time</small>
                    </div>

                    <div class="col-md-3 d-grid">
                        <label class="form-label fw-semibold invisible">Search</label>
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-search me-1"></i> Search Logs
                        </button>
                    </div>
                </div>

        </div>
        </form>
        </div>


        <div class="card-body overflow-auto" style="max-height: 800px;">

            <hr>
            <div id="logResults">
                <pre id="logResults" class="mb-0"></pre>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script>
        let logs = [];

        async function get_metadata() {
            try {
                const response = await fetch('servers.json?v=' + new Date().getTime());

                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }

                const data = await response.json();  // This will be a JS object (parsed JSON)
                return data;

            } catch (error) {
                console.error("Error loading server list:", error);
                alert("Failed to load server metadata. Please check console or try again later.");
                return null;
            }
        }





        async function filterLogs(event) {
            event.preventDefault();
            const form = event.target;

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const query = document.getElementById("searchQuery").value.trim();
            const useRegex = document.getElementById("useRegex").checked;
            const startTime = document.getElementById("startTime").value;
            const endTime = document.getElementById("endTime").value;
            const logname = document.getElementById("logname").value;

            const resultContainer = document.getElementById("logResults");
            resultContainer.innerHTML = `<div class="text-muted">Searching...</div>`;

            const response = await fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, useRegex, startTime, endTime, logname })
            });

            const data = await response.json();

            if (!response.ok) {
                resultContainer.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                return;
            }

            if (data.length === 0) {
                resultContainer.innerHTML = `<div class="alert alert-warning">No logs found.</div>`;
                return;
            }

            resultContainer.innerHTML = '';
            console.log(data)
            data.forEach(log => {
                const div = document.createElement("div");
                div.className = `card mb-2 shadow-sm border-start border-2 log-entry`;
                div.innerHTML = `
            <div class="card-body py-2 px-3">
                <div class="d-flex align-items-center mb-1">
                    <code class="me-2">${log.timestamp}</code>
                </div>
                <div class="text-dark" style="font-family: monospace;">${log.message}</div>
            </div>
        `;
                resultContainer.appendChild(div);
            });
        }


        function filterLogsss(event) {
            event.preventDefault();
            const form = event.target;

            if (!form.checkValidity()) {
                event.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            form.classList.add('was-validated');

            const query = document.getElementById("searchQuery").value.trim();
            const useRegex = document.getElementById("useRegex").checked;
            const startTime = document.getElementById("startTime").value;
            const endTime = document.getElementById("endTime").value;

            const start = startTime ? new Date(startTime) : new Date("1970-01-01T00:00:00");
            const end = endTime ? new Date(endTime) : new Date("2100-01-01T00:00:00");

            const resultContainer = document.getElementById("logResults");
            resultContainer.innerHTML = "";

            let regex;
            let terms = [];

            if (useRegex) {
                try {
                    regex = new RegExp(query, "i");
                } catch (err) {
                    resultContainer.innerHTML = `<div class="alert alert-danger">Invalid regular expression: ${err.message}</div>`;
                    return;
                }
            } else {
                terms = query.toLowerCase().split(/\s+/);
            }

            const filtered = logs.filter(log => {
                const logTime = new Date(log.timestamp);
                const inTimeRange = logTime >= start && logTime <= end;
                const text = log.message.toLowerCase();
                const matches = useRegex ? regex.test(log.message) : terms.some(term => text.includes(term));
                return inTimeRange && matches;
            });

            if (filtered.length === 0) {
                resultContainer.innerHTML = `<div class="alert alert-warning">No logs found.</div>`;
                return;
            }

            // filtered.forEach(log => {
            //     const div = document.createElement("div");
            //     div.className = `log-entry log-${log.level}`;
            //     div.innerHTML = `<strong>${log.timestamp}</strong> <span class="log-${log.level}">[${log.level}]</span> - ${log.message}`;
            //     resultContainer.appendChild(div);
            // });
            filtered.forEach(log => {
                const div = document.createElement("div");
                div.className = `card mb-2 shadow-sm border-start border-2 log-entry`;

                div.innerHTML = `
        <div class="card-body py-2 px-3">
            <div class="d-flex align-items-center mb-1">
          
                <code class="me-2">${log.timestamp}</code>
               
            </div>
            <div class="text-dark" style="font-family: monospace;">${log.message}</div>
        </div>
    `;
                resultContainer.appendChild(div);
            });

        }
        function populateSelect(selectId, options) {
            const select = document.getElementById(selectId);
            select.innerHTML = `<option value="" disabled selected>Select ${selectId.charAt(0).toUpperCase() + selectId.slice(1)}</option>`;

            options.forEach(opt => {
                const option = document.createElement("option");
                option.value = opt;
                option.textContent = opt;
                select.appendChild(option);
            });

            // Reset child dropdowns
            if (selectId === 'server') {
                populateSelect('service', []);
                populateSelect('logname', []);
            }
            if (selectId === 'service') {
                populateSelect('logname', []);
            }
        }

        async function loadLogs() {
            const response = await fetch('NCOMS.log');
            const text = await response.text();
            const lines = text.split('\n');
            logs = lines
                .filter(line => line.trim() !== '')
                .map(line => {
                    const match = line.match(/^([^:]+:[^:]+:[^:]+): /);
                    const timestamp = match ? match[1] : null;
                    return {
                        timestamp,
                        message: line
                    };
                });


        }
        window.addEventListener("DOMContentLoaded", async () => {
            const dropdownData = await get_metadata();  // <-- await here

            if (!dropdownData) return;

            const servers = Object.keys(dropdownData);
            populateSelect("server", servers);
            document.getElementById("server").addEventListener("change", function () {
                const services = Object.keys(dropdownData[this.value] || {});
                populateSelect("service", services);
            });

            document.getElementById("service").addEventListener("change", function () {
                const server = document.getElementById("server").value;
                const logs = dropdownData[server]?.[this.value] || [];
                populateSelect("logname", logs);
            });
            // loadLogs()
            const now = new Date();
            const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            const format = (date) => date.toISOString().slice(0, 16);

            document.getElementById("startTime").value = format(yesterday);
            document.getElementById("endTime").value = format(now);
        });

    </script>

</body>



</html>
